name: Build a Release

# Manual trigger only. Builds the module from `main`, finalizes the changelog,
# tags v<version>, creates the GitHub release with the module zip attached,
# publishes to ForgeBox (only when the FORGEBOX_TOKEN secret is set) and then
# bumps box.json to the next minor version.
on:
  # Reusable workflow : called by the `snapshot` workflow
  workflow_call:
    inputs:
      snapshot:
          description: 'Is this a snapshot build?'
          required: false
          default: false
          type: boolean

  # Manual Trigger
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MODULE_ID: ${{ github.event.repository.name }}
  JDK: 21
  SNAPSHOT: ${{ inputs.snapshot || false }}
  BUILD_ID: ${{ github.run_number }}

jobs:
  ##########################################################################################
  # Build & Publish
  ##########################################################################################
  build:
    name: Build & Publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Only release from the default branch
        if: env.SNAPSHOT == 'false' && github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Releases are built from ${{ github.event.repository.default_branch }} only (got ${{ github.ref_name }})"
          exit 1

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup CommandBox
        uses: Ortus-Solutions/setup-commandbox@v2.0.1
        with:
          forgeboxAPIKey: ${{ secrets.FORGEBOX_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: ${{ env.JDK }}

      - name: "Setup Environment Variables For Build Process"
        run: |
          VERSION=`cat box.json | jq '.version' -r`
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          box package set version=@build.version@+@build.number@
          # Build.cfc only stamps the build number for "master" builds
          echo "BRANCH=master" >> $GITHUB_ENV

      - name: Refuse to overwrite an existing tag
        if: env.SNAPSHOT == 'false'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Tag v${VERSION} already exists. Bump box.json before releasing."
            exit 1
          fi

      - name: Update changelog [unreleased] with latest version
        uses: thomaseizinger/keep-a-changelog-new-release@3.1.0
        if: env.SNAPSHOT == 'false'
        with:
          changelogPath: ./changelog.md
          tag: v${{ env.VERSION }}

      - name: Build ${{ env.MODULE_ID }}
        run: |
          npm install -g markdownlint-cli
          markdownlint changelog.md --fix
          box install commandbox-docbox
          box task run taskfile=Build target=run :version=${{ env.VERSION }} :projectName=${{ env.MODULE_ID }} :buildID=${{ env.BUILD_ID }} :branch=${{ env.BRANCH }}

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.MODULE_ID }}
          path: |
            .artifacts/**/*
            changelog.md

      - name: Commit Changelog [unreleased] with latest version
        if: env.SNAPSHOT == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog.md
          git commit -m "Finalized changelog for v${VERSION}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "refs/tags/v${VERSION}"

      - name: Extract release notes
        if: env.SNAPSHOT == 'false'
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' changelog.md > .tmp/release-notes.md
          cat .tmp/release-notes.md

      - name: Create Github Release
        if: env.SNAPSHOT == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            --verify-tag \
            --title "${VERSION}" \
            --notes-file .tmp/release-notes.md \
            .artifacts/${MODULE_ID}/${VERSION}/*.zip \
            .artifacts/${MODULE_ID}/${VERSION}/*.sha512 \
            .artifacts/${MODULE_ID}/${VERSION}/*.md5

      - name: Publish To ForgeBox
        if: env.SNAPSHOT == 'false'
        env:
          FORGEBOX_TOKEN: ${{ secrets.FORGEBOX_TOKEN }}
        run: |
          if [ -z "$FORGEBOX_TOKEN" ]; then
            echo "::warning::FORGEBOX_TOKEN is not set, skipping the ForgeBox publish."
            exit 0
          fi
          cd .tmp/${MODULE_ID}
          cat box.json
          box forgebox publish --force

  ##########################################################################################
  # Prep Next Release
  ##########################################################################################
  prep_next_release:
    name: Prep Next Release
    if: ${{ !inputs.snapshot }}
    runs-on: ubuntu-24.04
    needs: [ build ]
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup CommandBox
        uses: Ortus-Solutions/setup-commandbox@v2.0.1

      # Bump to next version
      - name: Bump Version
        run: |
          box bump --minor --!TagVersion

      # Commit it back
      - name: Commit Version Bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add box.json
          git commit -m "Version bump to `cat box.json | jq '.version' -r`"
          git push origin "HEAD:${{ github.ref_name }}"
